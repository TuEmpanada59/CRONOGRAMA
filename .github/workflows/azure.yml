# Compila en cada push y despliega a Azure App Service:
#   rama main → app de producción  ·  rama QA → app de pruebas
# Configuración (GitHub → Settings → Secrets and variables → Actions):
#   Variables: AZURE_WEBAPP_PROD, AZURE_WEBAPP_QA            (nombre de cada App Service)
#   Secrets:   AZURE_PUBLISH_PROFILE_PROD, AZURE_PUBLISH_PROFILE_QA  (perfil de publicación descargado de Azure)
# Si una variable no existe, ese despliegue se omite y solo se compila.
name: Compilar y desplegar

on:
  push:
    branches: [main, QA]
  pull_request:
    branches: [main, QA]
  workflow_dispatch:

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet publish Cronograma.csproj -c Release -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: publish

  produccion:
    needs: compilar
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.AZURE_WEBAPP_PROD != ''
    runs-on: ubuntu-latest
    environment: produccion
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app
          path: publish
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_PROD }}
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE_PROD }}
          package: publish

  qa:
    needs: compilar
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/QA' && vars.AZURE_WEBAPP_QA != ''
    runs-on: ubuntu-latest
    environment: qa
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app
          path: publish
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_QA }}
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE_QA }}
          package: publish
